# Multiple LLM configs: selectable from the frontend; the first model in the list is the default.
# Fields per model:
#   name         - custom model display name (shown in the frontend dropdown)
#   model        - actual model name used in API calls
#   url          - API base url
#   key_file     - key file name (located under agent/utils/llm_access/); when omitted, defaults to api_key_openai.txt
#   id               - unique id (defaults to name; recommended to set explicitly for frontend reference)
#   extra_params     - per-model extra body params (each model configures its own); omit or use {} to keep model default behavior
#   reasoning_effort - list of selectable values for the frontend Depth dropdown (e.g. ["low", "high", "max"]);
#                      the first value is selected by default. Omit or use [] to disable the dropdown for that model.
#                      The frontend always appends a "Default" option (send no reasoning_effort parameter).
#                      When extra_params also contains reasoning_effort, the dropdown is still available,
#                      but extra_params wins when the final request body is merged.
#   style_temperature - per-model {style name: temperature} dict for the frontend Style dropdown;
#                      "Default" is selected by default (sends no temperature parameter).
#                      Omit or use {} to disable the dropdown for that model.
#                      When extra_params also contains temperature, extra_params wins when merged.
#   supports_images  - boolean, whether the model accepts image (multimodal) input. When true,
#                      images saved in the blackboard IMAGES region are attached to the user message.
# Note: extra body params are now configured per model via the extra_params field in llm_models.
# DeepSeek official docs (api-docs.deepseek.com/zh-cn/guides/thinking_mode):
#   disable thinking  -> {"thinking": {"type": "disabled"}}
#   effort control    -> reasoning_effort: "low" / "high" / "max" (default high)
# Other providers (may differ, tokenhub may normalize):
#   GLM-5.3           -> use {"thinking": {"type": "enabled"}, "reasoning_effort": "low"|"high"|"max"} (default max)
#   OpenAI gpt-5/o    -> cannot disable, use {"reasoning_effort": "low"}
# Set to {} / remove to keep model default behavior.
llm_models:
  - id: "deepseek-v4.1-flash"
    name: "DeepSeek V4.1 Flash"          # custom model display name
    model: "deepseek-v4.1-flash"         # actual model name used in API calls
    url: "https://tokenhub.tencentmaas.com/v1"
    key_file: "api_key_openai.txt"     # key file name; defaults if omitted
    supports_images: true              # attach blackboard images (multimodal input)
    reasoning_effort: ["none", "low", "high", "max"]
    style_temperature: {Formal: 0.2, Casual: 0.7, Technical: 0.1}
    extra_params: {"max_tokens": 393216}
  - id: "deepseek-v4-flash"
    name: "DeepSeek V4 Flash"          # custom model display name
    model: "deepseek-v4-flash"         # actual model name used in API calls
    url: "https://tokenhub.tencentmaas.com/v1"
    key_file: "api_key_openai.txt"     # key file name; defaults if omitted
    supports_images: false
    reasoning_effort: ["none", "low", "high", "max"]
    style_temperature: {Formal: 0.2, Casual: 0.7, Technical: 0.1}
    extra_params: {"max_tokens": 393216}
  - id: "glm-5.3-flash"
    name: "glm5.3 flash"                   # custom model display name
    model: "glm-5.3-flash"
    url: "https://tokenhub.tencentmaas.com/v1"
    key_file: "api_key_openai.txt"       # create the corresponding key file in that directory if needed
    supports_images: true
    style_temperature: {Formal: 0.2, Casual: 0.7, Technical: 0.1}
    extra_params: {}
  - id: "glm-5.3-flashx"
    name: "glm5.3 flashx"                   # custom model display name
    model: "glm-5.3-flashx"
    url: "https://tokenhub.tencentmaas.com/v1"
    key_file: "api_key_openai.txt"       # create the corresponding key file in that directory if needed
    supports_images: false
    reasoning_effort: ["low", "high", "max"]
    extra_params: {}


# Example model names (qwen3.7-flash qwen3.8-max / glm-4 / deepseek-chat deepseek-v4-flash deepseek-v4-pro / qwen-max / gpt-4o-mini)

