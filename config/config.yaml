# Feature toggles - set false to disable the corresponding capability
enable_mcp: true
enable_base_knowledge: true
enable_web_search: true
enable_fetch_url: true

enable_target_knowledge: false

# enable_edit - set false to disable data/comment editing features (upload, delete table, edit comments/import)
enable_edit: true

enable_llmlog: false

# enable_perf_log - write API performance metrics to perf_log.csv (time, api_name, total_response_time, llm_first_chunk_time, llm_complete_time, code_exec_time, llm_input_chars)
enable_perf_log: true
