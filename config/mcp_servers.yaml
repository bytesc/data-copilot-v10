# MCP server configuration.
# Supported transport: "sse" (remote) or "stdio" (local subprocess).
#   SSE: requires "url", e.g. http://localhost:8101/sse
#   stdio: requires "command" and optional "args", e.g. ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# Optional timeouts (seconds): "timeout" for handshake/listing requests
# (default 30) and "call_timeout" for tools/call (default 120).

mcp_servers:
  - name: "calculator"
    description: "Math expression evaluator"
    transport: "sse"
    url: "http://localhost:8101/sse"

  - name: "datetime"
    description: "Date and time tools: get_current_time (with timestamp), weekday, add_days"
    transport: "sse"
    url: "http://localhost:8103/sse"