# 独立部署之二：后端 + nginx 前端（不含数据库）。
# 与 MySQL 完全解耦：本 stack 不启动数据库，也不依赖任何共享网络。
# 后端连哪个库，完全由 config/config.yaml 的连接串决定——可以是本机 docker 起的 MySQL，
# 也可以是其它机器、其它方式启动的 MySQL。
#
# 「连本机 docker 库」：在 config.yaml 里写 localhost:<宿主发布端口>（docker-compose.mysql.yml
# 默认发布在 3307，即 localhost:3307）。构建时只会把主机名 localhost 自动换成
# host.docker.internal，**端口沿用你写的值** —— 所以改发布端口只改 config.yaml 一处。
# 「连外部库」：直接在 config.yaml 写该库真实的 host:port（非 localhost），镜像不会改写。
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      # 宿主机发布端口直接写在本文件（容器内始终 8008）。
      - "8008:8008"
    volumes:
      # 静态文件目录固定为 tmp_imgs，前后端共享
      - ../tmp_imgs:/app/tmp_imgs
      - ../doc_workspace:/app/doc_workspace
    environment:
      - PYTHONUNBUFFERED=1
    # 让容器内能用 host.docker.internal 访问宿主机：本机 docker 起的 MySQL 发布在宿主 3307。
    # Docker Desktop 自带该名字；Linux 上由 host-gateway 提供。连外部库时用不到、也不影响。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Backend readiness: /api/config is a cheap handler that does not touch
      # the LLM. Used by the frontend service_healthy dependency below.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/config', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      # 宿主机发布端口直接写在本文件（容器内始终 8038）。
      - "8038:8038"
    depends_on:
      backend:
        condition: service_healthy
