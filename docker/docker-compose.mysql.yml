# 独立部署之一：MySQL（只负责跑数据库）。
# 与前后端（docker-compose.app.yml）完全独立：不含后端/前端，也不与任何 stack 共享网络。
# 只把容器 3306 发布到宿主机 3307，供任意前端后端连接——本机其它 stack、其它机器、
# 甚至非 docker 启动的进程都行。
services:
  mysql:
    image: mysql:8.0
    # 固定容器名，便于多个前后端共用时在 `docker ps` 里辨识。
    container_name: data-copilot-mysql
    restart: unless-stopped
    environment:
      # Root password. Keep it in sync with the backend DSNs in config/config.yaml
      # and with the readonly user in docker-init.sql. Literal value (no host env).
      MYSQL_ROOT_PASSWORD: "123456"
      # 允许从其它机器/容器用 root 连接（本库可能被远程前后端使用）。
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # 宿主机 3307 -> 容器 3306。用 3307 避免与宿主机本地 MySQL(3306) 冲突；
      # 改这里的发布端口时，只需同步改 config.yaml 里 DSN 的端口（构建时只换主机名
      # localhost->host.docker.internal，端口沿用 config.yaml 的值，Dockerfile 不写死端口）。
      - "3307:3306"
    command: --skip-ssl
    healthcheck:
      # $$ escapes compose interpolation; the container shell expands
      # MYSQL_ROOT_PASSWORD at runtime (the literal value set above).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
