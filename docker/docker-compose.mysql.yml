# 独立部署之一：MySQL。
# 与前后端（docker-compose.app.yml）分开部署，多个前后端栈可共用这一个数据库。
#
# 共享网络：两个 stack 都接入外部的 data-copilot-net，后端据此用服务名 `mysql`
# 连库（Dockerfile.backend 会把 config.yaml 里的 @localhost: 改写成 @mysql:）。
# 首次使用前必须先建网络（compose 不负责创建 external 网络）：
#   docker network create data-copilot-net
#
# 项目名固定用 -p docker，保持既有数据卷名 docker_mysql_data 不变，避免升级即丢数据。
services:
  mysql:
    image: mysql:8.0
    # 固定容器名，便于多个前后端栈共用时辨识；同时作为共享网络上的稳定别名。
    container_name: data-copilot-mysql
    restart: unless-stopped
    environment:
      # Root password for this MySQL container. Keep it in sync with the backend
      # DSNs in config/config.yaml and with the readonly user in docker-init.sql.
      # This is a literal value in this file (not a host-environment substitution).
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Host 3307 -> container 3306. Keep 3307 on the host to avoid clashing with
      # a local MySQL; the backend always connects to `mysql:3306` internally.
      - "3307:3306"
    command: --skip-ssl
    healthcheck:
      # $$ escapes compose interpolation; the container shell expands
      # MYSQL_ROOT_PASSWORD at runtime (the literal value set above).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data-copilot-net

networks:
  # 与前后端共享的 external 网络，需先 `docker network create data-copilot-net`。
  # 这里服务名 `mysql` 会成为该网络上的 DNS 别名，供各前后端栈的后端解析。
  data-copilot-net:
    external: true
    name: data-copilot-net

volumes:
  mysql_data:
