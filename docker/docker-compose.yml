services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Host 3307 -> container 3306. Keep 3307 on the host to avoid clashing with
      # a local MySQL; the backend always connects to `mysql:3306` internally.
      - "3307:3306"
    command: --skip-ssl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 静态文件目录固定为 tmp_imgs，前后端共享
      - ../tmp_imgs:/app/tmp_imgs
      - ../doc_workspace:/app/doc_workspace
    environment:
      - PYTHONUNBUFFERED=1
      # 下载链接前缀：改成浏览器可访问的地址，例如局域网 http://<服务器IP>:8038/
      - STATIC_PATH=${STATIC_PATH:-http://localhost:8038/}

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8038:8038"
    depends_on:
      - backend

volumes:
  mysql_data:
