services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Root password for this MySQL container. Keep it in sync with the backend
      # DSNs in config/config.yaml and with the readonly user in docker-init.sql.
      # This is a literal value in this file (not a host-environment substitution).
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Host 3307 -> container 3306. Keep 3307 on the host to avoid clashing with
      # a local MySQL; the backend always connects to `mysql:3306` internally.
      - "3307:3306"
    command: --skip-ssl
    healthcheck:
      # $$ escapes compose interpolation; the container shell expands
      # MYSQL_ROOT_PASSWORD at runtime (the literal value set above).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 静态文件目录固定为 tmp_imgs，前后端共享
      - ../tmp_imgs:/app/tmp_imgs
      - ../doc_workspace:/app/doc_workspace
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      # Backend readiness: /api/config is a cheap handler that does not touch
      # the LLM. Used by the frontend service_healthy dependency below.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/config', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8038:8038"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
