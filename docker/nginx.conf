server {
    listen 8038;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload bodies must pass through to the backend. nginx defaults to 1m, which
    # would reject CSV/document uploads before the backend's own limits (50MB CSV /
    # 20MB document) are ever checked. Kept slightly above 50MB to leave room for
    # multipart boundaries; the backend still enforces its own per-file caps.
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite outputs hashed bundles under /assets/. A missing asset must 404
    # instead of falling back to index.html (which would return HTML with 200
    # and silently break module loading).
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streams: disable response buffering so chunks reach the client
        # immediately (otherwise nginx buffers the whole stream).
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /upload-csv/ {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads may take longer than nginx's default 60s (large CSV import /
        # LLM-backed document comment generation); align with the SSE location.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /upload-txt/ {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /upload-txt/ runs LLM comment generation, which may take minutes; the
        # default 60s read timeout would return 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态文件目录固定为 tmp_imgs
    location /tmp_imgs/ {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
